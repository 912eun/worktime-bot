# fly.toml app configuration file generated for ye-worktime-bot on 2026-07-24T20:34:37+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ye-worktime-bot'
primary_region = 'nrt'

[build]
[env]
  DATA_DIR = '/data'

[[mounts]]
  source = 'botdata'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
